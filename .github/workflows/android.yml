name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build.log
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log
      - name: Check APK contents
        shell: bash
        run: |
          set -o pipefail
          {
            apk=app/build/outputs/apk/debug/app-debug.apk
            unzip -l "$apk" > apk-contents.txt
            grep -E "assets/|lib/" apk-contents.txt || true
            ls -l "$apk"
            # The model and the MediaPipe library for both phone ABIs must be inside the APK.
            for entry in 'assets/hand_landmarker\.task' 'lib/arm64-v8a/libmediapipe_tasks.*\.so' 'lib/armeabi-v7a/libmediapipe_tasks.*\.so'; do
              grep -qE " $entry\$" apk-contents.txt || { echo "error: missing from APK: $entry"; exit 1; }
            done
          } 2>&1 | tee -a build.log
      - name: Summary
        shell: bash
        run: |
          tests=$(grep -ho '<testsuite [^>]*' app/build/test-results/testDebugUnitTest/*.xml | sed -E 's/.*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/\1 tests, \2 failures, \3 errors/')
          size=$(stat -c %s app/build/outputs/apk/debug/app-debug.apk)
          echo "::notice title=Result::Unit tests: ${tests}. APK: $((size / 1048576)) MB."
      # Shows the reason for a failure on the run page itself, without opening the full log.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          {
            grep -hE "^e: |^w: |error:|FAILED|What went wrong|Could not|missing from APK|assets/|lib/" -A 4 build.log | head -n 120
            for report in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$report" ] && grep -hE "<testcase|<failure|Error|expected" "$report" | grep -B1 -A3 "<failure" | cut -c1-400 | head -n 80
            done
          } > failure.txt || true
          message=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' failure.txt | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=Build failure::${message}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mini-pots-ar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
